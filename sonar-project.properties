# SonarQube / SonarCloud — template.
#
# This file does nothing as long as no Sonar scan runs. If you use Sonar, enter
# projectKey/organization below; the exception underneath is already in place so
# the first scan does not start with a false positive.
#
# ── 🚨 NOBODY LOADS THIS FILE, and that is known ───────────────────────────
#
# There is no reader for it in this repository and no scan in any gate: it is
# read by `sonar-scanner`, which is not a dependency here, and by a SonarQube or
# SonarCloud server, which needs an account. So nothing can measure whether Sonar
# accepts the syntax below — this sentence is the honest answer, and it is here
# because an unchecked file WITHOUT one is a trap. (`scripts/foreign-config.test.ts`
# holds the same statement as the inventory entry it enforces.)
#
# ⚠️ What that costs was measured on 2026-08-12, and it is not theoretical. The
# exception below used to name `lib/digistore/connect.ts`, **a file that does not
# exist in this tree** — the developer key lives in `lib/digistore/config.mjs`.
# So the exception excused nothing, and the very first Sonar scan would have
# opened with exactly the false positive this block exists to prevent. Same
# failure shape as `.gitleaks.toml`, which was unloadable for a year for want of
# anybody running the tool. The paths are now kept in step with
# `DEVELOPER_KEY_PATHS` in `scripts/security/patterns.mjs` — the one list this
# project keeps of where that value legitimately appears — by a test, rather than
# by whoever remembers.

# sonar.projectKey=<enter here>
# sonar.organization=<enter here>
sonar.sources=.
sonar.exclusions=node_modules/**,.next/**,drizzle/**

# --- Justified exception -----------------------------------------------------
# The built-in Digistore24 developer key is not a secret: it carries no rights
# to any account, it only identifies the application to
# requestApiKey/retrieveApiKey — the role of an OAuth client ID. The
# rights-bearing API key comes into existence only when the merchant grants
# access. Full reasoning: lib/digistore/config.mjs (DIGISTORE_DEVELOPER_KEY).
#
# All four files that carry the value are listed. Two of them are the
# allowlists themselves (`.gitleaks.toml`, `patterns.mjs`) and `sonar.sources=.`
# reaches them, so leaving them out would report the exemption as the leak.
sonar.issue.ignore.multicriteria=ds24devkey1,ds24devkey2,ds24devkey3,ds24devkey4
sonar.issue.ignore.multicriteria.ds24devkey1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey1.resourceKey=lib/digistore/config.mjs
sonar.issue.ignore.multicriteria.ds24devkey2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey2.resourceKey=scripts/ds24/connect-api-key.mjs
sonar.issue.ignore.multicriteria.ds24devkey3.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey3.resourceKey=.gitleaks.toml
sonar.issue.ignore.multicriteria.ds24devkey4.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.ds24devkey4.resourceKey=scripts/security/patterns.mjs
